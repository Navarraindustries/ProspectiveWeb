# Integración continua: lo que antes solo se comprobaba a mano en un equipo.
#
# - backend: la suite entera en UN proceso (como aquí; en local se partía en
#   bloques por falta de memoria, y eso escondía un choque entre dos módulos).
#   En Windows y con las versiones fijadas de requirements-lock.txt, que es
#   donde se desarrolla y donde se sabe que pasa.
# - frontend: tipos, tests y vulnerabilidades de las dependencias de producción.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Dependencias
        run: python -m pip install -r requirements-lock.txt
      - name: Tests
        run: python -m pytest -q -p no:warnings

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test
      - name: Vulnerabilidades (producción)
        run: npm audit --omit=dev
