# Integración continua: lo que antes solo se comprobaba a mano en un equipo.
#
# - backend: la suite entera en UN proceso (como aquí; en local se partía en
#   bloques por falta de memoria, y eso escondía un choque entre dos módulos).
#   En Windows y con las versiones fijadas de requirements-lock.txt, que es
#   donde se desarrolla y donde se sabe que pasa.
# - frontend: tipos, tests y vulnerabilidades de las dependencias de producción.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Dependencias
        run: python -m pip install -r requirements-lock.txt
      - name: Tests
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -o pipefail
          # -v: si el proceso se cae (fallo de segmento), la última línea dice
          # en qué test estaba.
          python -X faulthandler -m pytest -v -p no:warnings -rfE 2>&1 | tee pytest.log
      # El registro completo exige iniciar sesión; las anotaciones no. Así el
      # motivo de un fallo se ve en la propia página de la ejecución.
      - name: Resumen del fallo
        if: failure()
        shell: bash
        run: |
          set +e
          grep -aE "^(FAILED|ERROR) |INTERNALERROR" pytest.log | head -6 | while IFS= read -r l; do echo "::error::${l}"; done
          echo "::error::FINAL: $(tail -n 30 pytest.log | paste -sd '|' - | cut -c1-3500)"
          exit 0

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependencias
        run: npm ci
      - name: Tipos
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npm test
      - name: Vulnerabilidades (producción)
        run: npm audit --omit=dev
