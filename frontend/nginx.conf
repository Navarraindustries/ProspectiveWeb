server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Un estudio DICOM pasa de 1 GB; el límite por defecto (1 MB) lo rechazaba.
    client_max_body_size 4g;

    # La segmentación tarda minutos. Va en segundo plano, pero la subida y la
    # detección responden en la misma petición.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/  { proxy_pass http://backend:8000; }
    location /data/ { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Los ficheros con hash en el nombre no cambian; index.html sí.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Rutas de la aplicación (/app/pacientes…): las resuelve el navegador.
    location / { try_files $uri $uri/ /index.html; }
}
