server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Un estudio DICOM pasa de 1 GB; el límite por defecto (1 MB) lo rechazaba.
    client_max_body_size 4g;

    # La segmentación tarda minutos. Va en segundo plano, pero la subida y la
    # detección responden en la misma petición.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Solo la dirección que ve nginx. Con $proxy_add_x_forwarded_for se
    # añadía a la que mandara el navegador, el backend (que confía en nginx)
    # tomaba la primera, y el límite de intentos de entrar se saltaba
    # cambiando esa cabecera.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Cabeceras de seguridad. Se repiten en las location con add_header
    # propio: nginx no hereda las del server en ese caso.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/  { proxy_pass http://backend:8000; }
    location /data/ { proxy_pass http://backend:8000; }
    location = /health { proxy_pass http://backend:8000; }

    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Los ficheros con hash en el nombre no cambian; index.html sí.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Rutas de la aplicación (/app/pacientes…): las resuelve el navegador.
    location / { try_files $uri $uri/ /index.html; }
}
